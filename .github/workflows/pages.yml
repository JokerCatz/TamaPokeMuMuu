name: Website

# Builds the Next.js site in website/ and publishes it to GitHub Pages together
# with the web installer (web/) and the README banner (docs/banner.png).
on:
  push:
    branches: [mods]
    paths: ["website/**", "web/**", "docs/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Build the site
        working-directory: website
        env:
          PAGES_BASE_PATH: /TamaPoke
        run: |
          npm ci
          npm run build
      - name: Add the web installer and the banner
        run: |
          cp -r web website/out/web
          mkdir -p website/out/docs
          cp docs/banner.png docs/banner-zh.png website/out/docs/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
